name: deploy-cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Secrets da Cloudflare
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID ausente. Deploy ignorado."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cf.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.cf.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          # 22.6+ aceita --experimental-strip-types no passo depois do next build.
          # Wrangler 4 pede Node >= 22. O 20.20.2 recusou a flag (exit 9).
          node-version: 22.22.2
          cache: npm

      - name: Instalar dependências
        if: steps.cf.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.cf.outputs.present == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.thezero.com.br
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_ADSENSE_PUB_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_PUB_ID }}
        run: npm run build:cloudflare

      - name: Deploy
        if: steps.cf.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name thezero-com-br
